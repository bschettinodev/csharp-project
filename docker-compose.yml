services:
  postgres:
    container_name: csharp-project-postgres
    image: postgres:16.3
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: csharp-project-pgadmin
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8889:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db-data: